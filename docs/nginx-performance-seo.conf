# ─────────────────────────────────────────────────────────────────────────────
# Apna Invoice — nginx performance + SEO snippet
#
# Production runs nginx + php-fpm (see deploy.sh), so the rules in
# public/.htaccess (Apache-only) do NOT apply. Fold the blocks below into your
# `server { … }` for apnainvoice.com to get the same wins: gzip/brotli,
# immutable caching for hashed assets, and www/http → https-apex canonicalisation.
#
# Debian/Ubuntu's default nginx gzips only text/html, so without this CSS/JS/SVG
# ship uncompressed — ~145 KB of avoidable bytes on the critical path on 4G.
# ─────────────────────────────────────────────────────────────────────────────

# 1) Canonicalise the host: force HTTPS and strip www → https://apnainvoice.com.
#    Matches public/.htaccess and the app-level URL::forceRootUrl(APP_URL) so
#    every canonical / og:url / sitemap URL resolves to one origin.
server {
    listen 80;
    listen [::]:80;
    server_name apnainvoice.com www.apnainvoice.com;
    return 301 https://apnainvoice.com$request_uri;
}
server {
    listen 443 ssl http2;
    server_name www.apnainvoice.com;
    # …ssl_certificate directives…
    return 301 https://apnainvoice.com$request_uri;
}

# 2) Inside the canonical `server { server_name apnainvoice.com; … }` block:

    # Compression — text responses shrink ~85% (the ~213 KB home page → ~30 KB).
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        application/rss+xml image/svg+xml font/ttf font/otf;
    # If ngx_brotli is compiled in, prefer it:
    # brotli on;
    # brotli_types text/plain text/css application/javascript application/json image/svg+xml;

    # Vite emits content-hashed filenames under /build — safe to cache forever.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Brand assets + user uploads: a month is plenty (filenames are stable).
    location ~* ^/(brand|storage)/.*\.(webp|png|jpe?g|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # HTML must never be cached so meta / content edits go live immediately.
    location = / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri /index.php?$query_string;
    }
