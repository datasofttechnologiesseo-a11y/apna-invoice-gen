# ─────────────────────────────────────────────────────────────────────────────
# Apna Invoice — nginx performance + SEO snippet
#
# Production runs nginx + php-fpm (see deploy.sh), so the rules in
# public/.htaccess (Apache-only) do NOT apply. Fold the blocks below into your
# `server { … }` for apnainvoice.com to get the same wins: gzip/brotli,
# immutable caching for hashed assets, and www/http → https-apex canonicalisation.
#
# Debian/Ubuntu's default nginx gzips only text/html, so without this CSS/JS/SVG
# ship uncompressed — ~145 KB of avoidable bytes on the critical path on 4G.
# ─────────────────────────────────────────────────────────────────────────────

# 1) Canonicalise the host: force HTTPS and strip www → https://apnainvoice.com.
#    Matches public/.htaccess and the app-level URL::forceRootUrl(APP_URL) so
#    every canonical / og:url / sitemap URL resolves to one origin.
server {
    listen 80;
    listen [::]:80;
    server_name apnainvoice.com www.apnainvoice.com;
    return 301 https://apnainvoice.com$request_uri;
}
server {
    listen 443 ssl http2;
    server_name www.apnainvoice.com;
    # …ssl_certificate directives…
    return 301 https://apnainvoice.com$request_uri;
}

# 2) Inside the canonical `server { server_name apnainvoice.com; … }` block:

    # Compression — text responses shrink ~85% (the ~213 KB home page → ~30 KB).
    # gzip_proxied any: without it nginx skips compression for any request
    # that arrived through a proxy/CDN (it carries a Via header).
    # Images, woff/woff2 and PDFs are already compressed; leave them out.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/csv text/javascript
        application/javascript application/json application/ld+json
        application/manifest+json application/xml application/rss+xml
        application/xhtml+xml image/svg+xml image/x-icon font/ttf font/otf;
    # If ngx_brotli is compiled in, prefer it:
    # brotli on;
    # brotli_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Static files never reach Laravel's SecurityHeaders middleware (HTML gets
    # the full set from the app), so each static location below sends nosniff
    # itself. It is not set at server level because the app already sends it
    # on HTML, and nginx would append a duplicate to PHP responses.

    # Vite emits content-hashed filenames under /build/assets — safe to cache
    # forever. One Cache-Control header (expires + add_header would send two).
    location /build/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # Brand assets + user uploads: a month is plenty (filenames are stable;
    # uploaded logos get a new random name when replaced).
    location ~* ^/(brand|storage)/.*\.(webp|avif|png|jpe?g|gif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # Stable names that must be re-checked on every visit, or a new service
    # worker / web manifest sits unseen behind the browser cache.
    location = /service-worker.js {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # HTML is never cached: Laravel already sends "Cache-Control: no-cache,
    # private" on every page, so nothing extra is needed for PHP responses.
    # Do NOT add a long `expires` to `location /` or `location ~ \.php$`.
